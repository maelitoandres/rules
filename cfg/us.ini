;===============================================================
; 策略组 — 每个 app 独立可控，候选顺序即默认值
;
; 每个组都可下钻到全部 5 个节点，候选顺序即默认值：
;   运营类（抖音/小红书/微博/TikTok/加密货币）默认 🇨🇴，微信默认 DIRECT
;   其余组默认 🇺🇸
; ⚠️ 其他组也能选到 🇨🇴 节点（保留颗粒度），但误选会让该 app 的流量
;    从运营 IP 出去、污染其信誉 —— 除非明确需要，不要切到 🇨🇴
; 🔒 一律 select，禁止 url-test（运营账号最怕 IP 自动切换）
; 🔒 🇺🇸 快线不含 DIRECT —— 它被 socks5 的 dialer-proxy 引用，
;    一旦选中 DIRECT，桥接会静默退化为明文直连
;===============================================================

;--------- 运营专用（含哥伦比亚出口）---------
custom_proxy_group=🎶 抖音`select`(🇨🇴|社媒|冲浪)`[]DIRECT`(🇺🇸|CN2GIA|日本中转|直连备用)
