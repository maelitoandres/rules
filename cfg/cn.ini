;--------- 节点分组（供上面各组引用，也可单独切换）---------
;   ⚠️ 本组是 CO 运营节点的 dialer-proxy 桥接目标，用 url-test 自动择优。
;   🇯🇵 日本 改名后不再被 (🇺🇸) 匹配，故显式列出 —— 实测它是最快的桥接路径。
;   这里可以用 url-test —— 桥接节点变化不改变最终出口 IP(仍是 BD 住宅 IP)，
;   平台风控看不到任何变动。但运营出口组(🇨🇴 社媒/冲浪)必须保持 select。
;   实测(2026-08-15): 桥接经 CN2GIA 到抖音 1315ms，经日本中转 469ms;
;   两者裸延迟仅差 105ms，差距来自 CN2GIA→BD哥伦比亚 那一段的路径质量。
;   注意 url-test 测的是节点裸延迟，未必反映到 BD 的路径质量。
;   参数: 300秒测一次, 容差 50ms(差距小于此值不切换，避免抖动)
; ★ 桥接专用故障转移组（2026-08-17 新增）
;   运营节点的 dialer-proxy 指向这里，而不是直接指向 CN2GIA快线。
;
;   为什么用 fallback 而不是 url-test:
;     url-test 选【延迟最低】的成员 —— 日本 61-77ms 会永远压过 CN2GIA 167ms，
;     等于指定 CN2GIA 白指定。fallback 是【按顺序取第一个可用的】: CN2GIA 活着
;     就用它，挂了自动降到日本，恢复后自己切回来，正好是桥接需要的语义。
;
;   为什么单独建组而不是把日本塞进 CN2GIA快线:
;     CN2GIA快线 要保持"就是 CN2GIA"的语义，面板上手动选它时不该跑到别的线路。
;     故障转移是另一件事，混在一起两个诉求都满足不了。
;
;   interval 用 60s 而非 300s: 桥接层故障会直接让运营流量报 connect error
;   (实测 2026-08-16 有 39 次)，5 分钟才发现太久。代价是多一点健康检查流量。
;
;   ⚠️ 成员顺序即优先级，不要随意调整。
custom_proxy_group=🔄 故障转移`fallback`[]🇺🇸 CN2GIA`[]🇯🇵 日本`[]🇺🇸 直连备用`http://www.gstatic.com/generate_204`60,5

