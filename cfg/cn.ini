;===============================================================
; 🇨🇳 中国办公室 — OpenClash 订阅转换模板
; 仓库: https://github.com/maelitoandres/rules
;
; 设计: 保留 app 级策略组，每个 app 可独立指定出口
; 节点: 🇺🇸 CN2GIA / 🇯🇵 日本 / 🇺🇸 直连备用
;       🇨🇴 运营01(23.27.43.108) / 🇨🇴 运营02(23.27.41.10) / 🇨🇴 运营03(136.0.47.9)
;       2026-08-17: BD 已下线，其 IP 段注册在 RIPE，被粗粒度国内库判为美国
;===============================================================

[custom]

;---------------------------------------------------------------
; 节点重命名（JMS 原始名含 service ID）
; Decodo 节点(运营01/02/03)在 gist 里已是最终名，不需要 rename —— 这也是
; 刻意不给它们加国旗的原因: subconverter 会剥离 emoji，带旗就得再 rename 补回
;---------------------------------------------------------------
rename=JMS.*c55s2\..*@🇺🇸 直连备用
rename=JMS.*c55s3\..*@🇺🇸 CN2GIA
rename=JMS.*c55s4\..*@🇯🇵 日本
; 国旗会被 subconverter 剥掉，用 rename 补回（^$ 确保只对无前缀的生效）
; ⚠️ gist 里必须写【不带国旗】的 运营01/02/03，带了会被剥成同名再被这里
;    加一次，结果不变；但若哪天 subconverter 行为改变就会出现双重前缀。
rename=^运营01$@🇨🇴 运营01
rename=^运营02$@🇨🇴 运营02
rename=^运营03$@🇨🇴 运营03

;---------------------------------------------------------------
; 排除：c55s1(12%丢包) c55s5(不可用) c55s801(10倍率)
;---------------------------------------------------------------
exclude_remarks=(c55s1\.|c55s5\.|c55s801\.)

