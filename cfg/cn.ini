;===============================================================
; 🇨🇳 中国办公室 — OpenClash 订阅转换模板
; 仓库: https://github.com/maelitoandres/rules
;
; 特点: 默认走代理，国内服务直连，socks5 强制经加密桥接
; 说明: 三份 ini 的策略组完全相同，差异仅在 ruleset 的映射
;===============================================================

[custom]

;---------------------------------------------------------------
; 节点重命名（JMS 原始名含 service ID，改写为规范命名）
;---------------------------------------------------------------
rename=JMS.*c55s2\..*@🇺🇸 直连备用
rename=JMS.*c55s3\..*@🇺🇸 CN2GIA
rename=JMS.*c55s4\..*@🇺🇸 日本中转

;---------------------------------------------------------------
; 排除节点
;   c55s1   — 实测 12% 丢包
;   c55s5   — 不可用
;   c55s801 — 10 倍流量节点
;---------------------------------------------------------------
exclude_remarks=(c55s1\.|c55s5\.|c55s801\.)

;===============================================================
; 规则（从上往下遍历，先命中先生效 — 顺序即优先级）
;===============================================================

;--------- 局域网必须最先 ---------
ruleset=🎯 全球直连,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Lan/Lan.list

;===============================================================
; ★ 运营绑定层 — 必须排在所有地域规则之前
;   抖音等域名同时符合「中国服务应直连」和「运营须走 CO 住宅 IP」，
;   运营绑定必须赢，所以放在最前
;===============================================================
ruleset=🇨🇴 CO社媒运营,https://raw.githubusercontent.com/maelitoandres/rules/main/rule/CO/CO_social_rule.list
ruleset=🇨🇴 CO社媒运营,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/DouYin/DouYin.list
ruleset=🇨🇴 CO社媒运营,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/XiaoHongShu/XiaoHongShu.list
ruleset=🇨🇴 CO社媒运营,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/Weibo/Weibo.list
ruleset=🇨🇴 CO社媒运营,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/TikTok/TikTok.list

ruleset=🇨🇴 CO冲浪快线,https://raw.githubusercontent.com/maelitoandres/rules/main/rule/CO/CO_crypto_rule.list

;--------- 美国出口（券商等） ---------
ruleset=🇺🇸 稳定专线,https://raw.githubusercontent.com/maelitoandres/rules/main/rule/US/US_rule.list

;--------- 中国服务：在中国办公室直连 ---------
