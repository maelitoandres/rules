; 供 OpenClash 自定义规则中的 AND 规则使用：只劫持运营 WiFi 网段的微信
custom_proxy_group=💬 微信运营`select`[]DIRECT`(运营)`[]🇺🇸 CN2GIA快线`[]🇺🇸 冲浪快线
custom_proxy_group=🎶 TikTok`select`[]DIRECT`(运营)`[]🇺🇸 CN2GIA快线`[]🇺🇸 冲浪快线
; ⚠️ 不要选 运营01/02/03(Decodo) —— Decodo 按域名类目黑名单拦截金融/加密站点，
;    实测 2026-08-16: 同一时刻 example.com/Cloudflare 返回 200，而币安/OKX/
;    Coinbase/CoinGecko/Chase 全部连不上。文档措辞是 cryptocurrency financing，
;    但实施上不看用途，纯行情站 CoinGecko 同样被拦，且明示专用 ISP 不可解封。
;    加密货币交易所看的是国际 IP 库，本就不需要哥伦比亚住宅 IP，走日本即可。
custom_proxy_group=🪙 加密货币`select`[]🇯🇵 日本`[]🇺🇸 CN2GIA快线`[]🇺🇸 冲浪快线`[]DIRECT
