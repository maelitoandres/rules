;===============================================================
; 策略组（三份 ini 完全相同）
;
; 🔒 铁律一：一律 select，禁止 url-test
;            节点固定，且运营账号最怕 IP 自动切换
; 🔒 铁律二：CO 组不含 DIRECT
;            误选会让运营流量暴露本地真实 IP
; 🔒 铁律三：🇺🇸 稳定专线不含 DIRECT
;            它被 socks5 的 dialer-proxy 引用，
;            一旦选中 DIRECT，桥接静默退化为明文直连
; 🔒 铁律四：漏网之鱼绝不含 🇨🇴 节点
;            未匹配流量若走运营 IP，会迅速污染其信誉
;===============================================================
custom_proxy_group=🇨🇴 CO社媒运营`select`(🇨🇴)
custom_proxy_group=🇨🇴 CO冲浪快线`select`(🇨🇴)
custom_proxy_group=🇺🇸 稳定专线`select`(🇺🇸)
custom_proxy_group=🇺🇸 冲浪快线`select`(🇺🇸)
custom_proxy_group=🇨🇳 中国出口`select`[]DIRECT
custom_proxy_group=📢 谷歌FCM`select`[]DIRECT`[]🇺🇸 冲浪快线
custom_proxy_group=🎯 全球直连`select`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]🇺🇸 冲浪快线`[]DIRECT

;===============================================================
; 下方参数请勿修改
;===============================================================
enable_rule_generator=true
overwrite_original_rules=true
