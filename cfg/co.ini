;--------- 节点分组（供上面各组引用，也可单独切换）---------
;   ⚠️ 本组是 BD 节点的 dialer-proxy 桥接目标。用 url-test 自动择优。
;   这里可以用 url-test —— 桥接节点变化不改变最终出口 IP(仍是 BD 住宅 IP)，
;   平台风控看不到任何变动。但运营出口组(🇨🇴 社媒/冲浪)必须保持 select。
;   实测(2026-08-15): 桥接经 CN2GIA 到抖音 1315ms，经日本中转 469ms。
;   注意 url-test 测的是节点裸延迟，未必反映到 BD 的路径质量。
custom_proxy_group=🇺🇸 快线`url-test`[]🇺🇸 CN2GIA`(🇺🇸)`http://www.gstatic.com/generate_204`300,,50
;   同上 —— 🇨🇴 冲浪 节点的桥接目标，同样用 url-test 自动择优。
custom_proxy_group=🇺🇸 冲浪快线`url-test`[]🇺🇸 CN2GIA`(🇺🇸)`http://www.gstatic.com/generate_204`300,,50

