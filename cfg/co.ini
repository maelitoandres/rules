;===============================================================
; 🇨🇴 哥伦比亚办公室 — OpenClash 订阅转换模板
; 仓库: https://github.com/maelitoandres/rules
;
; 设计: 保留 app 级策略组，每个 app 可独立指定出口
; 特点: 默认直连，美国服务走美国节点，中国服务待回国节点
; 节点: 🇺🇸 CN2GIA / 🇺🇸 日本中转 / 🇺🇸 直连备用 / 🇨🇴 社媒 / 🇨🇴 冲浪
;===============================================================

[custom]

;---------------------------------------------------------------
; 节点重命名（JMS 原始名含 service ID）
;---------------------------------------------------------------
rename=JMS.*c55s2\..*@🇺🇸 直连备用
rename=JMS.*c55s3\..*@🇺🇸 CN2GIA
rename=JMS.*c55s4\..*@🇺🇸 日本中转
; BD 节点的国旗会被 subconverter 剥掉，用 rename 补回（^$ 确保只对无前缀的生效）
rename=^社媒$@🇨🇴 社媒
rename=^冲浪$@🇨🇴 冲浪

;---------------------------------------------------------------
; 排除：c55s1(12%丢包) c55s5(不可用) c55s801(10倍率)
;---------------------------------------------------------------
exclude_remarks=(c55s1\.|c55s5\.|c55s801\.)

