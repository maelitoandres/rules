# NAME: CN_sdk_rule
# 出口: 🎯 全球直连（DIRECT）
#
# 说明: 国产 App 普遍集成的第三方 SDK —— 推送、统计、厂商服务、授时。
#       这些服务的服务器都在国内，此前因为没有规则覆盖而掉进「🐟 漏网之鱼」
#       跟着走美国节点，绕地球一圈再回来：既慢，又把设备标识和网络环境
#       上报给了一个美国出口。
#
# 为什么走 DIRECT 而不是 CO:
#       这类 SDK 是系统级/框架级组件，不属于任何单一 App，把它们导向运营
#       出口既无必要（平台判定看的是 App 自身的业务通道），又会污染运营 IP
#       的行为画像。国内服务直连是最快也最合理的选择。
#
# 来源: 2026-08-16 全局漏网之鱼扫描（10.1.2.33 / .110 / .203 / .246 四台设备）

payload:

#极光推送 JPush（覆盖 jpush.cn / jpush.io 及 .localdomain 变形）
  - DOMAIN-KEYWORD,jpush

#个推 GeTui（sdk.open.talk.getui.net/.com、sdk-open-phone.getui.com、gepush.com）
  - DOMAIN-KEYWORD,getui
  - DOMAIN-KEYWORD,gepush

#易通消息（与 jpush 同批出现，19000 端口）
  - DOMAIN-SUFFIX,easytomessage.com

#腾讯云统计上报
# ⚠️ 不要写 DOMAIN-SUFFIX,tencent-cloud.net —— 那是腾讯云通用域名，会把
#    微信相关流量一起强拉到 DIRECT，绕过「💬 微信运营 → 🇨🇴 社媒」的分流，
#    与运营目标背道而驰。只收明确是统计上报的具体主机名。
  - DOMAIN-KEYWORD,pcdnwxstat #apd-pcdnwxstat.teg.tencent-cloud.net 微信PCDN统计

#高德定位 SDK（被大量国产 App 集成）
# 运营设备固定在办公场所内，不需要导航服务——这类请求纯属后台定位调度上报。
# 走直连而非 CO 的理由: 高德的位置主要基于基站/WiFi/GPS 而非 IP，把它导向
# 哥伦比亚也骗不过定位，反而多一次异常的跨境请求。
# 实测: dispatcher.is.autonavi.com 来自运营网段设备，原走 ChinaMedia→DIRECT。
  - DOMAIN-SUFFIX,autonavi.com #高德(NS 为 ns3/ns4.aliyun.com，阿里系)
  - DOMAIN-SUFFIX,amap.com #高德地图主域名

#手机厂商服务（系统更新、验证码、统计 SDK）
  - DOMAIN-SUFFIX,vivo.com.cn #含 onrt-stsdk / adlog / vcode / appupgrade
  - DOMAIN-SUFFIX,vivo.com
  - DOMAIN-SUFFIX,miui.com
  - DOMAIN-SUFFIX,xiaomi.com
  - DOMAIN-SUFFIX,oppomobile.com
  - DOMAIN-SUFFIX,heytapmobi.com #OPPO/一加
  - DOMAIN-SUFFIX,hicloud.com #华为
  - DOMAIN-SUFFIX,vmall.com #华为商城

#NTP 授时（对延迟敏感，绕代理影响时间同步精度）
  - DOMAIN-SUFFIX,pool.ntp.org
  - DOMAIN-SUFFIX,ntp.org
  - DOMAIN-SUFFIX,ntp.aliyun.com
  - DOMAIN-SUFFIX,ntp.tencent.com

#群晖 QuickConnect（自有 NAS 的内网穿透）
# 2026-08-16 实测: usc.quickconnect.to 及 *.fishcargo.direct.quickconnect.to
# 掉进「🐟 漏网之鱼」走了美国节点 —— NAS 就在本地局域网，绕地球一圈再回来，
# 传输速度直接砍到跨境带宽的水平。QuickConnect 会先尝试打洞直连内网地址，
# 走代理反而会让它误判网络环境、退化成中继模式。
  - DOMAIN-SUFFIX,quickconnect.to
