# NAME: CO_wechat_rule
# 策略组: 💬 微信运营
# 出口: 哥伦比亚 ISP 住宅 IP（select 手动固定）
# 说明: 微信视频号(Finder)专用域名。上游 WeChat.list 只收了
#       vweixinf/vweixinthumb 两条，缺少 finder 系列，导致视频号流量
#       落到 ChinaMedia 的 video.qq.com 规则上走了直连。
#
# ⚠️ 本文件在 ini 中被 AND 规则引用，只对运营 WiFi 网段生效；
#    其他设备的微信不受影响。

#视频号 Finder
payload:
  - DOMAIN-KEYWORD,finder #finderbdy/finderdyh/finder.video 等整个系列
  - DOMAIN-SUFFIX,channels.weixin.qq.com
  - DOMAIN-SUFFIX,vweixinf.tc.qq.com
  - DOMAIN-SUFFIX,vweixinthumb.tc.qq.com
  - DOMAIN-SUFFIX,wxsnsdythumb.wxs.qq.com
  - DOMAIN-SUFFIX,wxapp.tc.qq.com

# ★ 上游 WeChat.yaml 漏掉的 .cn 后缀域名（2026-08-16 实测）
#   上游收的是 weixin.qq.com，而这批是 qq.com.cn / wechatpay.cn ——
#   顶级域不同，DOMAIN-SUFFIX 完全匹配不到，全部落到 ChinaDomain 走了直连。
#   NS 记录确认归属腾讯: qq.com.cn → ns1/ns3/ns4.qq.com
#                        wxqcloud.qq.com.cn → ns-tel1/ns-tel2.qq.com
  - DOMAIN-SUFFIX,qq.com.cn #含 mmec/prewxacode.wxqcloud.qq.com.cn、dns.weixin.qq.com.cn
  - DOMAIN-SUFFIX,wechatpay.cn #含 paydns.wechatpay.cn、szshort.mixpay.wechatpay.cn

# ★ 微信启动时的固定检查（2026-08-16 实测，各出现 6 次，来自运营机 10.1.9.33）
#   刷视频号期间出现，属微信启动流程的一组探测——拉配置、查套餐、探下载通道。
#   都是小请求且连接随即关闭，不是大文件下载，走 CO 的代价可忽略。
#   收进来是为了信号一致: 运营机上微信的每个动作都从哥伦比亚出去，不留混合痕迹。
#   ⚠️ 若将来发现微信更新包也走 dldir1，需改为只收 chong.kingcard 单主机，
#      避免几十 MB 的下载绕行地球一圈半。
  - DOMAIN-SUFFIX,dldir1.qq.com #腾讯下载通道探测(IPv4)
  - DOMAIN-SUFFIX,dldir1v6.qq.com #同上(IPv6)
  - DOMAIN-SUFFIX,kingcard.qq.com #腾讯王卡套餐检测
