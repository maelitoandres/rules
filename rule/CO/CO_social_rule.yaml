# NAME: CO_social_rule
# 策略组: 🇨🇴 CO补充
#
# 说明: 需要走 CO 节点、但【不属于任何单一 app】的域名。
#
# ★ 2026-08-16 重构: 原本这里是所有平台补充规则的大杂烩，已按 app 拆分——
#     字节系   → CO_douyin_rule.yaml → 🎶 抖音
#     新浪系   → CO_weibo_rule.yaml  → 📕 微博
#     小红书   → CO_xhs_rule.yaml    → 📕 小红书
#
#   拆分原因: 补充规则原先统一指向「🇨🇴 CO补充」组，与 app 主规则所在的组
#   相互独立。在面板切换某个 app 的出口时，它的补充规则不会跟着切，导致
#   同一 app 的流量从两个不同 IP 出去——对运营账号而言，这比 IP 不对更容易
#   触发风控。拆分后每份补充规则与对应 app 走同一策略组，切换时同步生效。
#
# 本文件保留用途:
#   · 跨平台的通用域名（多个 app 共用的第三方服务）
#   · 归属尚未确认、暂时无法归类的域名
#   · 新发现漏网域名时的临时落脚点，确认归属后再移入对应 app 的规则集
#
# 判断归属的方法见 rule/README.md「加规则前的验证规范」——
# NS 记录比对、IP 段整段抽查、关键字特异性评估。

payload:

# ★ 数美科技 风控 SDK（2026-08-16 实测）
#   以 fp-it.fengkongcloud.com.localdomain 掉进「🐟 漏网之鱼」走美国，出现 6 次。
#   fp = fingerprint，这是设备指纹采集与上报通道，被小红书/抖音等大量 app 集成。
#
#   为什么必须走 CO 而不是 DIRECT:
#     风控服务端会把「设备指纹」与「业务请求 IP」关联比对。业务流量从哥伦比亚
#     出去、指纹却从美国(或中国)上报，等于主动告诉风控系统这台设备在用代理。
#     宁可让它跟着业务流量走同一个出口，也不要留下两个来源。
#
#   为什么放在本文件而不是某个 app 的规则集:
#     数美是跨 app 的通用 SDK，无法归属到单一平台。放这里的好处是它被运营设备
#     的 AND 规则覆盖 —— 只对 10.1.2.33 / 10.1.2.34 生效，同网段其他设备照常
#     直连，不会因为一个通用 SDK 把无关流量拽进运营出口。
  - DOMAIN-KEYWORD,fengkongcloud #数美风控 兜住 .localdomain 变形

# ⚠️ 临时探针（验证 classical provider 是否接受 AND 逻辑规则），验证后删除
# 用不存在的 IP 与域名，不会匹配任何真实流量
  - AND,((SRC-IP-CIDR,10.9.9.99/32),(DOMAIN-SUFFIX,and-rule-probe.invalid))
  - AND,((SRC-IP-CIDR,10.9.9.98/32),(RULE-SET,DouYin))
