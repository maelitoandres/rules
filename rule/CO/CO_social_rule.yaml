# ★ 微博海外 CDN 的 IP 段（2026-08-16 实测）
#   微博 App 用硬编码 IP 直连这批 CDN，不发 Host/SNI，嗅探器拿不到域名
#   (sniffHost 为空)，只能落到 MATCH 兜底跟着漏网之鱼走美国。
#   两台设备(10.1.2.33 / 10.1.2.110)、两轮测试抓到的是同一组 IP，稳定。
#   ⚠️ EdgeNext(AS139057) 与 Zenlayer(AS21859) 是共享 CDN，其他中国 app
#      出海也可能用这些段，加了会一并导向 CO。已收窄到 /24，且实测这五段
#      只有微博在跑。若将来发现误伤，按段移除即可。
#   no-resolve: 只对已知 IP 的连接匹配，不触发域名解析，避免拖慢。
  - IP-CIDR,154.92.24.0/24,no-resolve #EdgeNext 香港
  - IP-CIDR,151.242.229.0/24,no-resolve #EdgeNext 洛杉矶
  - IP-CIDR,98.96.229.0/24,no-resolve #Zenlayer 迈阿密
  - IP-CIDR,199.245.60.0/24,no-resolve #Zenlayer 迈阿密
  - IP-CIDR,128.14.118.0/24,no-resolve #Zenlayer 圣保罗
