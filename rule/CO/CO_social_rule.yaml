# ★ 微博海外 CDN 的 IP 段（2026-08-16 实测）
#   微博 App 用硬编码 IP 直连这批 CDN，不发 Host/SNI，嗅探器拿不到域名
#   (sniffHost 为空)，只能落到 MATCH 兜底跟着漏网之鱼走美国。
#   两台设备(10.1.2.33 / 10.1.2.110)、两轮测试抓到的是同一组 IP，稳定。
#   ⚠️ EdgeNext(AS139057) 与 Zenlayer(AS21859) 是共享 CDN，其他中国 app
#      出海也可能用这些段，加了会一并导向 CO。已收窄到 /24，且实测这五段
#      只有微博在跑。若将来发现误伤，按段移除即可。
#   no-resolve: 只对已知 IP 的连接匹配，不触发域名解析，避免拖慢。
  - IP-CIDR,154.92.24.0/24,no-resolve #EdgeNext 香港
  - IP-CIDR,151.242.229.0/24,no-resolve #EdgeNext 洛杉矶
  - IP-CIDR,98.96.229.0/24,no-resolve #Zenlayer 迈阿密
  - IP-CIDR,199.245.60.0/24,no-resolve #Zenlayer 迈阿密
  - IP-CIDR,128.14.118.0/24,no-resolve #Zenlayer 圣保罗

# ★ 新浪自有服务器段（AS37936 SINA）
#   微博用非标准端口 8081 硬编码 IP 直连自家北京服务器，无域名无 SNI，
#   落在中国 IP 段被 GeoIP(cn) 判为国内 → 走 DIRECT，暴露真实 IP。
#   ⚠️ 不能用 IP-ASN 覆盖：新浪多数服务器托管在 AS4134(中国电信骨干网)，
#      按 ASN 加会把整个电信网络导向 CO。只能按实测到的段逐个补。
  - IP-CIDR,36.51.224.0/24,no-resolve #新浪北京 AS37936 端口8081 2026-08-16实测

# ★ ACE (AS139341) —— 小红书的海外 CDN
#   实测抓到 5 个分散的段: 43.159.79 / 43.159.95 / 43.175.104 / 43.175.224 / 43.175.225
#   (新加坡与美国 Tucumcari 混杂)。按 /24 逐个加容易漏，且 CDN 随时可能启用新段，
#   故用 ASN 整体覆盖。
#   ⚠️ ACE 是共享 CDN 服务商，其他中企出海业务也可能用它，加此规则会一并导向 CO。
#      实测本网内只有小红书在跑这批 IP。若发现误伤，改回按 /24 精确覆盖。
#   依赖 ASN.mmdb（已随 geox-url 自动更新，12MB，OpenClash 内置）
  - IP-ASN,139341,no-resolve #ACE 小红书海外CDN 2026-08-16实测

# ★ 阿里云海外 CDN（AS24429）—— 小红书在用
#   ⚠️ 这里刻意【不用】IP-ASN,24429：那是阿里云整个海外网络，覆盖面极大，
#      会把所有走阿里云海外服务的流量都拽进 CO。只按实测到的段精确覆盖。
#   两段均四点抽查确认整段归属 AS24429。
  - IP-CIDR,163.181.60.0/24,no-resolve #阿里云 亚特兰大 2026-08-16刷小红书实测
  - IP-CIDR,47.246.2.0/24,no-resolve #阿里云 莫斯科 同批扫出
