  - DOMAIN-KEYWORD,sinaimg #含 ad.us.sinaimg.cn.localdomain
  - DOMAIN-KEYWORD,xhscdn #小红书CDN 含 ads-img-al.xhscdn.com.localdomain
  - DOMAIN-KEYWORD,xiaohongshu
  - DOMAIN-KEYWORD,snssdk #字节 mon.snssdk.com.localdomain 2026-08-16实测漏走美国
  - DOMAIN-KEYWORD,amemv #抖音同系列，防 .localdomain 变形

