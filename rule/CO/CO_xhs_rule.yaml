# NAME: CO_xhs_rule
# 策略组: 📕 小红书（与上游 XiaoHongShu.yaml 同组）
#
# 说明: 小红书域名与海外 CDN 补充。
#
# ★ 为什么指向「📕 小红书」而不是独立的补充组:
#   补充规则必须与 app 主规则走同一个策略组，否则面板切换小红书出口时这些规则
#   不跟着切，同一账号的流量会从两个 IP 出去。

payload:

# ★ 关键字兜底 .localdomain 变形
#   实测漏网案例: ads-img-al.xhscdn.com.localdomain 走了美国节点。
#   客户端 DNS 解析失败时附加搜索域重试，后缀一变 DOMAIN-SUFFIX 就失配。
  - DOMAIN-KEYWORD,xhscdn #小红书 CDN
  - DOMAIN-KEYWORD,xiaohongshu
  - DOMAIN-SUFFIX,askdiandian.com #小红书「点点」AI搜索App(阿里云) 2026-08-20实测

# ★ ACE (AS139341) —— 小红书的海外 CDN
#   实测抓到 5 个分散的段: 43.159.79 / 43.159.95 / 43.175.104 / 43.175.224 / 43.175.225
#   (新加坡与美国 Tucumcari 混杂)。按 /24 逐个加容易漏，且 CDN 随时可能启用新段，
#   故用 ASN 整体覆盖。
#   ⚠️ ACE 是共享 CDN 服务商，其他中企出海业务也可能用它。实测本网内只有小红书
#      在跑这批 IP。若发现误伤，改回按 /24 精确覆盖。
#   依赖 ASN.mmdb（随 geox-url 自动更新，OpenClash 内置）
  - IP-ASN,139341,no-resolve #ACE 小红书海外CDN 2026-08-16实测

# ★ 阿里云海外 CDN（AS24429）
#   ⚠️ 这里刻意【不用】IP-ASN,24429：那是阿里云整个海外网络，覆盖面极大，
#      会把所有走阿里云海外服务的流量都拽进 CO。只按实测到的段精确覆盖。
#   各段均多点抽查确认整段归属 AS24429。
  - IP-CIDR,163.181.60.0/24,no-resolve #阿里云 亚特兰大 刷小红书实测
  - IP-CIDR,47.246.2.0/24,no-resolve #阿里云 莫斯科 同批扫出
# ★ 2026-08-16 实测: 小红书评论属地仍显示美国，根因是这一段。
#   客户端【直接连 IP、不做 DNS 解析】，所以域名规则一条都匹配不到，
#   连续 8 个地址 155.102.55.28~35 全部掉进「🐟 漏网之鱼」走了美国节点。
#   五点抽查(.1/.28/.31/.35/.200)整段一致 → 按 /24 整段收录。
#   ⚠️ 这类纯 IP 连接是分流的盲区: 日志里只有 IP 没有域名，靠关键字/后缀
#      规则永远补不上，只能靠监控漏网之鱼里的裸 IP 逐段排查。
  - IP-CIDR,155.102.55.0/24,no-resolve #阿里云 丹佛 评论接口走这段

# ★ 2026-08-20 实测: .33 活跃时段连续裸 IP 直连 186.121.145.46-53 的 80/443
#   （无域名），掉进「🐟 漏网之鱼」走了日本 —— 同 app 流量分走两个 IP。
#   rDNS = edgeISP-*.ateneatelecomunicaciones.xyz（玻利维亚本地 ISP ATENEA，
#   AS267823），无 SNI 探测返回阿里云 *.certfallback.com 证书 —— 即阿里云
#   边缘节点(ENS)借放在拉美 ISP 机房。账号被判定哥伦比亚后，阿里系 CDN
#   就近调度到拉美边缘，域名规则拦不到裸 IP，按段收录。
#   归属 app 以证书判定为阿里系（运营 app 中即小红书）；若后续实测归属
#   其他 app，移到对应文件即可（AND 规则两台设备都覆盖，不影响生效）。
  - IP-CIDR,186.121.145.0/24,no-resolve #阿里ENS边缘@玻利维亚ATENEA 2026-08-20实测
