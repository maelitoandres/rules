#   评论/上报恰好走该通道时，属地即显示真实位置（偶发属地泄漏的直接通道）。
#   模式与 CO_weibo_rule 的新浪 36.51.224.0/24:8081 完全同型。
#   归属: 111.13.0.0/16 AS9808 中国移动（字节租用移动 IDC 形态，域名规则
#   永远够不着，只能按实测段精确覆盖）。
#   ⚠️ 只按实测 /24 收录，禁止扩到 /16 或 IP-ASN,9808（会把移动系服务拽进 CO）。
#      若发现误伤（运营设备的移动系 App 流量走了 CO），删本段并在此记录。
  - IP-CIDR,111.13.225.0/24,no-resolve #移动IDC 字节TTNet私有协议:8081 2026-08-20实测
