# NAME: CO_douyin_rule
# 策略组: 🎶 抖音（与上游 DouYin.yaml 同组）
#
# 说明: 字节系域名补充。上游 blackmatrix7 的 DouYin.yaml 只收了 13 条，
#       覆盖远远不够——实测刷抖音会用到几十个字节域名。
#
# ★ 为什么指向「🎶 抖音」而不是独立的补充组:
#   补充规则必须与 app 主规则走同一个策略组，否则在面板切换抖音出口时，
#   这些域名不会跟着切，同一个 app 的流量会从两个不同 IP 出去——
#   对运营账号来说，这比 IP 不对更容易触发风控。
#
# ⚠️ 字节大量租用第三方基础设施（移动 AS56044/56047、联通 AS17623/17816/136958、
#    金山云 AS141679），IP 段归属显示的是「房东」不是「租户」，段内混杂，
#    无法按 IP 段加规则——域名关键字是唯一可靠的覆盖方式。

payload:

#字节系域名
  - DOMAIN-SUFFIX,zijieapi.com
